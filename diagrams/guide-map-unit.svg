<svg xmlns="http://www.w3.org/2000/svg" class="mm-map guide-map-unit" viewBox="0 0 360 1124" role="group" aria-labelledby="guide-map-unit-title guide-map-unit-desc">
<title id="guide-map-unit-title">Where things are in the unit</title>
<desc id="guide-map-unit-desc">A zone map, not to scale. TV wall, door, kitchenette, wardrobe cabinet and bed, with what is kept in each.</desc>
<style>
.mm-map{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.mm-map text{font-family:var(--font-b,'Raleway',system-ui,sans-serif);font-size:13px;font-weight:500;font-variant-numeric:lining-nums;fill:var(--text-heading,#2E1F12)}
.mm-map .mm-t{font-size:14px;font-weight:700}
.mm-map .mm-d{fill:var(--text-muted,#6B5242)}
.mm-map .mm-h{font-family:var(--font-d,'Cormorant Garamond',Georgia,serif);font-size:20px;font-weight:700}
.mm-map .mm-small{font-size:11.5px;fill:var(--text-muted,#6B5242)}
.mm-map .mm-node rect{fill:var(--surface-raised,#FBF7EE);stroke:var(--border-strong,#B8A88C);stroke-width:1.5}
.mm-map .mm-branch rect{stroke:var(--accent,#C9963A);stroke-width:2}
.mm-map .mm-root rect{fill:#1C1006;stroke:var(--accent,#C9963A);stroke-width:1.5}
.mm-map .mm-root text{fill:#F7F2E8}
.mm-map .mm-root .mm-small{fill:#E3D5BC}
.mm-map .mm-line{fill:none;stroke:var(--accent,#C9963A);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mm-map .mm-arrow{fill:var(--accent,#C9963A)}
.mm-map .mm-chev{fill:none;stroke:var(--bronze-ink,var(--bronze,#765110));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mm-map .mm-root .mm-chev{stroke:#F7F2E8}
.mm-map .mm-badge{fill:var(--accent,#C9963A)}
.mm-map .mm-badge-t{fill:#1C1006;font-weight:700;text-anchor:middle}
.mm-map a.mm-node{cursor:pointer;outline:none;text-decoration:none}
.mm-map a.mm-node:hover rect,.mm-map a.mm-node:focus-visible rect{stroke:var(--bronze-ink,var(--bronze,#765110));stroke-width:2.5}
</style>
<g class="mm-node mm-root"><rect x="12" y="10" width="336" height="62" rx="10"/><text class="mm-h" x="26" y="38">Where things are in the unit</text><text class="mm-small" x="26" y="58">Not to scale. This is not a floor plan.</text></g>
<g><path class="mm-line" d="M26 72V123.5H40"/><g class="mm-node mm-branch"><rect x="40" y="90" width="308" height="67" rx="10"/><text class="mm-t" x="52" y="110">TV wall</text><text class="mm-d" x="52" y="127">Wooden tray on the TV cabinet,</text><text class="mm-d" x="52" y="144">below the TV, beside the flower vase</text></g><path class="mm-line" d="M54 157V192H66"/><a class="mm-node" href="#s5-ac" aria-label="Aircon remote. On the tray, with the TV remote. Read about the air conditioner"><rect x="66" y="167" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="187">Aircon remote</text><text class="mm-d" x="78" y="204">On the tray, with the TV remote</text><path class="mm-chev" d="M328 187l6 5l-6 5"/></a><path class="mm-line" d="M54 192V252H66"/><a class="mm-node" href="#s3-appliances" aria-label="TV remote. On the tray. Read about the appliance guides"><rect x="66" y="227" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="247">TV remote</text><text class="mm-d" x="78" y="264">On the tray</text><path class="mm-chev" d="M328 247l6 5l-6 5"/></a><path class="mm-line" d="M54 252V320.5H66"/><a class="mm-node" href="#s4-confirm-leave" aria-label="Key card. On its keychain, kept with the remotes. Read the Confirm and Leave checks"><rect x="66" y="287" width="282" height="67" rx="10"/><text class="mm-t" x="78" y="307">Key card</text><text class="mm-d" x="78" y="324">On its Cascade Hideaway keychain,</text><text class="mm-d" x="78" y="341">kept with the remotes</text><path class="mm-chev" d="M328 315.5l6 5l-6 5"/></a><path class="mm-line" d="M54 320.5V397.5H66"/><g class="mm-node"><rect x="66" y="364" width="282" height="67" rx="10"/><text class="mm-t" x="78" y="384">Gate pod lock (optional)</text><text class="mm-d" x="78" y="401">Kept indoors with the key card</text><text class="mm-d" x="78" y="418">and remotes</text></g><path class="mm-line" d="M54 397.5V466H66"/><a class="mm-node" href="#s5-ecoflow" aria-label="EcoFlow RIVER 3. Near the TV unit. Read about the EcoFlow"><rect x="66" y="441" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="461">EcoFlow RIVER 3</text><text class="mm-d" x="78" y="478">Near the TV unit</text><path class="mm-chev" d="M328 461l6 5l-6 5"/></a></g>
<g><path class="mm-line" d="M26 123.5V529H40"/><g class="mm-node mm-branch"><rect x="40" y="509" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="534">Door</text></g><path class="mm-line" d="M54 549V592.5H66"/><g class="mm-node"><rect x="66" y="559" width="282" height="67" rx="10"/><text class="mm-t" x="78" y="579">Main breaker</text><text class="mm-d" x="78" y="596">By the door, on your left</text><text class="mm-d" x="78" y="613">as you face out from inside</text></g></g>
<g><path class="mm-line" d="M26 529V664H40"/><g class="mm-node mm-branch"><rect x="40" y="644" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="669">Kitchenette</text></g><path class="mm-line" d="M54 684V719H66"/><a class="mm-node" href="#s5-brownout" aria-label="Emergency light. On top of the fridge. Read about brownout days"><rect x="66" y="694" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="714">Emergency light</text><text class="mm-d" x="78" y="731">On top of the fridge</text><path class="mm-chev" d="M328 714l6 5l-6 5"/></a></g>
<g><path class="mm-line" d="M26 664V782H40"/><g class="mm-node mm-branch"><rect x="40" y="762" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="787">Wardrobe cabinet</text></g><path class="mm-line" d="M54 802V837H66"/><g class="mm-node"><rect x="66" y="812" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="832">Garment steamer</text><text class="mm-d" x="78" y="849">In the wardrobe cabinet</text></g><path class="mm-line" d="M54 837V897H66"/><g class="mm-node"><rect x="66" y="872" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="892">Hangers</text><text class="mm-d" x="78" y="909">In the wardrobe cabinet</text></g></g>
<g><path class="mm-line" d="M26 782V960H40"/><g class="mm-node mm-branch"><rect x="40" y="940" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="965">Bed</text></g><path class="mm-line" d="M54 980V1015H66"/><g class="mm-node"><rect x="66" y="990" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="1010">Single pull-out bed</text><text class="mm-d" x="78" y="1027">Stored under the queen bed</text></g></g>
<path class="mm-line" d="M26 960V1087H40"/>
<a class="mm-node" href="#s4-turnover" aria-label="Turnover. Doing a turnover with the Cleaner app"><rect x="40" y="1062" width="308" height="50" rx="10"/><text class="mm-t" x="52" y="1082">Turnover</text><text class="mm-d" x="52" y="1099">Doing a turnover with the Cleaner app</text><path class="mm-chev" d="M328 1082l6 5l-6 5"/></a>
</svg>
