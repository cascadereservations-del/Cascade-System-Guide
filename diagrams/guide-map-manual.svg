<svg xmlns="http://www.w3.org/2000/svg" class="mm-map guide-map-manual" viewBox="0 0 360 1286" role="group" aria-labelledby="guide-map-manual-title guide-map-manual-desc">
<title id="guide-map-manual-title">Operations Manual map</title>
<desc id="guide-map-manual-desc">The Operations Manual pages in four groups: Operations, Communication, Business and System. Pages with a section in this chapter are links.</desc>
<style>
.mm-map{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.mm-map text{font-family:var(--font-b,'Raleway',system-ui,sans-serif);font-size:13px;font-weight:500;font-variant-numeric:lining-nums;fill:var(--text-heading,#2E1F12)}
.mm-map .mm-t{font-size:14px;font-weight:700}
.mm-map .mm-d{fill:var(--text-muted,#6B5242)}
.mm-map .mm-h{font-family:var(--font-d,'Cormorant Garamond',Georgia,serif);font-size:20px;font-weight:700}
.mm-map .mm-small{font-size:11.5px;fill:var(--text-muted,#6B5242)}
.mm-map .mm-node rect{fill:var(--surface-raised,#FBF7EE);stroke:var(--border-strong,#B8A88C);stroke-width:1.5}
.mm-map .mm-branch rect{stroke:var(--accent,#C9963A);stroke-width:2}
.mm-map .mm-root rect{fill:#1C1006;stroke:var(--accent,#C9963A);stroke-width:1.5}
.mm-map .mm-root text{fill:#F7F2E8}
.mm-map .mm-root .mm-small{fill:#E3D5BC}
.mm-map .mm-line{fill:none;stroke:var(--accent,#C9963A);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mm-map .mm-arrow{fill:var(--accent,#C9963A)}
.mm-map .mm-chev{fill:none;stroke:var(--bronze-ink,var(--bronze,#765110));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mm-map .mm-root .mm-chev{stroke:#F7F2E8}
.mm-map .mm-badge{fill:var(--accent,#C9963A)}
.mm-map .mm-badge-t{fill:#1C1006;font-weight:700;text-anchor:middle}
.mm-map a.mm-node{cursor:pointer;outline:none;text-decoration:none}
.mm-map a.mm-node:hover rect,.mm-map a.mm-node:focus-visible rect{stroke:var(--bronze-ink,var(--bronze,#765110));stroke-width:2.5}
</style>
<g class="mm-node mm-root"><rect x="12" y="10" width="336" height="62" rx="10"/><text class="mm-h" x="26" y="38">Operations Manual</text><text class="mm-small" x="26" y="58">Tap a page to read about it</text></g>
<g><path class="mm-line" d="M26 72V110H40"/><g class="mm-node mm-branch"><rect x="40" y="90" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="115">Operations</text></g><path class="mm-line" d="M54 130V165H66"/><a class="mm-node" href="#s3-dashboard" aria-label="Dashboard: Start page and quick links"><rect x="66" y="140" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="160">Dashboard</text><text class="mm-d" x="78" y="177">Start page and quick links</text><path class="mm-chev" d="M328 160l6 5l-6 5"/></a><path class="mm-line" d="M54 165V225H66"/><a class="mm-node" href="#s3-sops" aria-label="Guest Journey SOPs: 5-star guest service steps"><rect x="66" y="200" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="220">Guest Journey SOPs</text><text class="mm-d" x="78" y="237">5-star guest service steps</text><path class="mm-chev" d="M328 220l6 5l-6 5"/></a><path class="mm-line" d="M54 225V285H66"/><a class="mm-node" href="#s3-cleaning-page" aria-label="Cleaning Checklist: Turnover standards and app link"><rect x="66" y="260" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="280">Cleaning Checklist</text><text class="mm-d" x="78" y="297">Turnover standards and app link</text><path class="mm-chev" d="M328 280l6 5l-6 5"/></a><path class="mm-line" d="M54 285V345H66"/><a class="mm-node" href="#s3-appliances" aria-label="Video Resources: Short training videos"><rect x="66" y="320" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="340">Video Resources</text><text class="mm-d" x="78" y="357">Short training videos</text><path class="mm-chev" d="M328 340l6 5l-6 5"/></a><path class="mm-line" d="M54 345V405H66"/><g class="mm-node"><rect x="66" y="380" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="400">Crisis Playbook</text><text class="mm-d" x="78" y="417">Steps for guest problems</text></g><path class="mm-line" d="M54 405V465H66"/><g class="mm-node"><rect x="66" y="440" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="460">Maintenance Log</text><text class="mm-d" x="78" y="477">Maintenance tracker and reminders</text></g><path class="mm-line" d="M54 465V525H66"/><g class="mm-node"><rect x="66" y="500" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="520">Maps</text><text class="mm-d" x="78" y="537">Quick picture guides</text></g></g>
<g><path class="mm-line" d="M26 110V588H40"/><g class="mm-node mm-branch"><rect x="40" y="568" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="593">Communication</text></g><path class="mm-line" d="M54 608V643H66"/><g class="mm-node"><rect x="66" y="618" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="638">AI Concierge</text><text class="mm-d" x="78" y="655">AI helper for writing replies</text></g><path class="mm-line" d="M54 643V703H66"/><g class="mm-node"><rect x="66" y="678" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="698">Message Hub</text><text class="mm-d" x="78" y="715">Ready-to-copy guest messages</text></g><path class="mm-line" d="M54 703V763H66"/><g class="mm-node"><rect x="66" y="738" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="758">Guest-Facing Guide</text><text class="mm-d" x="78" y="775">What guests see</text></g></g>
<g><path class="mm-line" d="M26 588V826H40"/><g class="mm-node mm-branch"><rect x="40" y="806" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="831">Business</text></g><path class="mm-line" d="M54 846V881H66"/><g class="mm-node"><rect x="66" y="856" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="876">Cost &amp; Profitability</text><text class="mm-d" x="78" y="893">Cost per booking, breakeven</text></g><path class="mm-line" d="M54 881V941H66"/><g class="mm-node"><rect x="66" y="916" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="936">Pricing Strategy</text><text class="mm-d" x="78" y="953">Rates built from your costs</text></g><path class="mm-line" d="M54 941V1001H66"/><g class="mm-node"><rect x="66" y="976" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="996">Important Info</text><text class="mm-d" x="78" y="1013">Contacts and property details</text></g><path class="mm-line" d="M54 1001V1061H66"/><g class="mm-node"><rect x="66" y="1036" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="1056">Finance</text><text class="mm-d" x="78" y="1073">Revenue and expense records</text></g></g>
<g><path class="mm-line" d="M26 826V1124H40"/><g class="mm-node mm-branch"><rect x="40" y="1104" width="308" height="40" rx="10"/><text class="mm-t" x="52" y="1129">System</text></g><path class="mm-line" d="M54 1144V1179H66"/><g class="mm-node"><rect x="66" y="1154" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="1174">Access Log</text><text class="mm-d" x="78" y="1191">Who opened the Manual</text></g><path class="mm-line" d="M54 1179V1239H66"/><g class="mm-node"><rect x="66" y="1214" width="282" height="50" rx="10"/><text class="mm-t" x="78" y="1234">Account Settings</text><text class="mm-d" x="78" y="1251">Who can open what</text></g></g>
</svg>
